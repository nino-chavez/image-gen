<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Signal X Studio — Bracketed</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1024px;
    height: 1024px;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg { display: block; }
</style>
</head>
<body>
  <svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <!-- Rounded-square frame with an X inscribed inside -->
    <rect x="160" y="160" width="704" height="704" rx="120" ry="120"
          fill="none" stroke="#f5f5f5" stroke-width="32" />
    <g stroke="#f5f5f5" stroke-width="76" stroke-linecap="square" fill="none">
      <line x1="340" y1="340" x2="684" y2="684" />
      <line x1="684" y1="340" x2="340" y2="684" />
    </g>
  </svg>
</body>
</html>
