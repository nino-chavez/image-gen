<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Signal X Studio — Node X</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1024px;
    height: 1024px;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg { display: block; }
</style>
</head>
<body>
  <svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <!-- Geometric X with a circular signal node at the crossing point.
         The node reads as a junction / signal hub at avatar size and
         disappears into a thicker center at favicon size. -->
    <g stroke="#f5f5f5" stroke-width="92" stroke-linecap="square" fill="none">
      <line x1="276" y1="276" x2="748" y2="748" />
      <line x1="748" y1="276" x2="276" y2="748" />
    </g>
    <circle cx="512" cy="512" r="76" fill="#0a0a0a" />
    <circle cx="512" cy="512" r="40" fill="#f5f5f5" />
  </svg>
</body>
</html>
